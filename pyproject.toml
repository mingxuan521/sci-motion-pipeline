[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-motion-pipeline"
version = "0.1.0"
description = "中文科学可视化视频流水线：解说词到成片，纯 CPU 也能跑"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mingxuan521" }]
keywords = ["video", "tts", "ffmpeg", "science", "visualization", "中文"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "edge-tts>=7.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4.9"]

[project.scripts]
sci-motion = "sci_motion.cli:main"

[tool.setuptools]
packages = ["sci_motion"]
